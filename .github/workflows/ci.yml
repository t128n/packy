name: CI

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build
